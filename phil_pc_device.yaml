#!/usr/bin/env ansible-playbook
#
# dnf install ansible-core ansible-collection-ansible-posix ansible-collection-community-general
# ansible-playbook --extra-vars "old_root=/mnt/1" <<this-file>>
#
# This is my personal Fedora setup.
#
# I usually install a new release with the root_fs on a fresh,
# dedicated LV, keeping the previous Fedora releases' root_fs
# around. After I boot into the fresh installation, I mount the
# previous root_fs onto /mnt/1 and pass that mountpoint as old_root to
# the Ansible playbook.

- hosts: localhost
  connection: local
  become: true
  tasks:

    - name: Gather the package facts
      ansible.builtin.package_facts:
        manager: auto

#    - name: Show facts available on the system
#      ansible.builtin.debug:
#        var: ansible_facts

    - name: Install dnf plugins
      ansible.builtin.dnf:
        name: dnf-plugins-core
        update_cache: yes
        state: present

    - name: Enable and start ssh server
      ansible.builtin.service:
        name: sshd
        state: started
        enabled: yes

    - name: Create groups
      ansible.builtin.group:
        name: "{{ item.name }}"
        gid: "{{ item.gid }}"
        state: present
      loop:
       - { name: 'mp3', gid: 900 }
       - { name: 'phil', gid: 1001 }
       - { name: 'christine', gid: 1004 }
       - { name: 'quirin', gid: 1005 }

    - name: Extract previous password hashes
      ansible.builtin.shell: grep {{ item }} {{ old_root }}/etc/shadow | cut -f2 -d ":"
      register: pw_hashes
      loop: ["phil", "christine", "quirin"]
      changed_when: false
      when: old_root is defined

    - name: Ensure users exist (with password hashes)
      ansible.builtin.user:
        name: "{{ item.user }}"
        comment: "{{ item.comment }}"
        uid: "{{ item.uid }}"
        group: "{{ item.group }}"
        groups: "{{ item.groups }}"
        password: "{{ (pw_hashes.results | selectattr('item', 'equalto', item.user) | first).stdout }}"
        append: true
        state: present
      loop:
        - { user: 'phil', comment: 'Philipp Reisner', uid: 1001, group: 'phil', groups: 'phil,mp3,wheel' }
        - { user: 'christine', comment: 'Christine Berger', uid: 1004, group: 'christine', groups: 'christine,mp3,wheel' }
        - { user: 'quirin', comment: 'Quirin Berger', uid: 1005, group: 'quirin', groups: 'quirin,mp3' }
      when: old_root is defined and pw_hashes is defined and pw_hashes.results is defined

    - name: Ensure users exist
      ansible.builtin.user:
        name: "{{ item.user }}"
        comment: "{{ item.comment }}"
        uid: "{{ item.uid }}"
        group: "{{ item.group }}"
        groups: "{{ item.groups }}"
        append: true
        state: present
      loop:
        - { user: 'phil', comment: 'Philipp Reisner', uid: 1001, group: 'phil', groups: 'phil,mp3,wheel' }
        - { user: 'christine', comment: 'Christine Berger', uid: 1004, group: 'christine', groups: 'christine,mp3,wheel' }
        - { user: 'quirin', comment: 'Quirin Berger', uid: 1005, group: 'quirin', groups: 'quirin,mp3' }
      when: not (old_root is defined and pw_hashes is defined and pw_hashes.results is defined)

    - name: Enable Fedora Copr Ubuntu fonts
      community.general.copr:
        name: atim/ubuntu-fonts
        state: enabled

    - name: Install ubuntu font
      ansible.builtin.dnf:
        name: ubuntu-family-fonts
        update_cache: yes
        state: present

    - name: Install dev tools 1
      ansible.builtin.dnf:
        name: ["emacs", "git", "git-email", "flex", "bison", "kernel-devel", "coccinelle",
               "clang-tools-extra", "bear", "autoconf", "automake", "keyutils-libs-devel",
               "clang" ]
        update_cache: yes
        state: present

    - name: Install dev tools 2
      ansible.builtin.dnf:
        name: ["openssl-devel-engine", "patch", "diffutils", "clitest", "asciidoctor", "po4a",
               "libaio-devel.x86_64", "ncurses-devel", "gcc-c++", "wireshark", "tcpdump",
               "strace", "ltrace", "pandoc", "pyproject-rpm-macros", "pyp2rpm", "python3-devel",
               "python3-flake8", "python3-build" ]
        update_cache: yes
        state: present

    - name: Install dev tools 3
      ansible.builtin.dnf:
        name: ["cargo", "nodejs", "npm", "difftastic"]
        update_cache: yes
        state: present

    - name: Enable Fedora Copr Mergiraf
      community.general.copr:
        name: patrickl/dev
        state: enabled

    - name: Install Mergiraf
      ansible.builtin.dnf:
        name: ["mergiraf"]
        update_cache: yes
        state: present

    - name: Generic tools
      ansible.builtin.dnf:
        name: ["mc", "htop", "nvtop", "btop", "console-setup", "mutt", "pwgen", "moreutils", "iproute-tc", "fio",
               "fish", "podman", "pylsp", "python3-pyOpenSSL", "pip", "virt-install", "virt-manager",
               "lnav", "lshw", "bsdtar", "calc", "libguestfs-tools", "guestfs-tools", "openldap-clients" ]
        update_cache: yes
        state: present

    - name: Applications
      ansible.builtin.dnf:
        name: ["gimp", "inkscape", "qgit", "xournal", "xournalpp",
               "libvirt-daemon-kvm", "libreoffice-langpack-de", "libvirt-nss", "v4l-utils",
               "waypipe", "vlc", "obs-studio", "plasma-nm-fortisslvpn", "libvirt-daemon-config-network",
               "dejavu-fonts-all", "tesseract-langpack-deu"]
        update_cache: yes
        state: present

    - name: Install Google Chrome
      ansible.builtin.dnf:
        enablerepo: google-chrome
        name: google-chrome-stable
        state: present

    - name: Install latest Zoom client if not yet installed
      ansible.builtin.dnf:
        name: https://zoom.us/client/latest/zoom_x86_64.rpm
        state: present
        disable_gpg_check: yes
      when: "'zoom' not in ansible_facts.packages"

    - name: Create a symbolic link for consolefont
      ansible.builtin.file:
        src: /usr/share/consolefonts/Lat15-Terminus32x16.psf.gz
        dest: /usr/lib/kbd/consolefonts/Lat15-Terminus32x16.psf.gz
        owner: root
        group: root
        state: link

    - name: Set consolefont
      ansible.builtin.replace:
        path: /etc/vconsole.conf
        regexp: '^FONT=.*'
        replace: 'FONT=Lat15-Terminus32x16.psf.gz'
      register: consolefont_update

    - name: Activate consolefont
      ansible.builtin.service:
        name: systemd-vconsole-setup.service
        state: restarted
      when: consolefont_update.changed

    - name: Set default URI for virsh and libvirt
      ansible.builtin.replace:
        path: /etc/libvirt/libvirt.conf
        regexp: '^#uri_default.*'
        replace: 'uri_default = "qemu:///system"'

    - name: Configure NSS to resove virtual machines
      ansible.builtin.replace:
        path: /etc/nsswitch.conf
        regexp: 'mdns4_minimal \['
        replace: 'mdns4_minimal libvirt_guest ['

    - name: Add phil to libvirt group
      ansible.builtin.user:
        name: phil
        groups: libvirt
        append: true
        state: present

    - name: Enable BlueZ experimental features (needed to pair Logitech BT mouse on F44)
      community.general.ini_file:
        path: /etc/bluetooth/main.conf
        section: General
        option: "{{ item }}"
        value: "true"
      loop:
        - Experimental
        - KernelExperimental
      register: bluez_main_conf

    - name: Restart bluetooth service
      ansible.builtin.service:
        name: bluetooth
        state: restarted
      when: bluez_main_conf.changed

    - name: Create Mountpoints /mnt/1 /mnt/2 and homes on NFS
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "{{ item.mode }}"
        owner: "{{ item.o }}"
        group: "{{ item.g }}"
        state: directory
      loop:
        - { path: /mnt/1, mode: 'u=rwx,g=rx,o=rx', o: root, g: root }
        - { path: /mnt/2, mode: 'u=rwx,g=rx,o=rx', o: root, g: root }
        - { path: /home/base/christine, mode: 'u=rwx,g=rx,o=rx', o: christine, g: christine }
        - { path: /home/base/phil, mode: 'u=rwx,g=rx,o=rx', o: phil, g: phil }

# Do not use hostnames for the NFS server, as it can resolve to ipv6
    - name: NFS mounts for home network
      ansible.posix.mount:
        src: "{{ item.src }}"
        path: "{{ item.path }}"
        fstype: nfs
        opts: rsize=8192,wsize=8192,timeo=14,user,soft
        state: "{{ 'present' if ansible_facts.form_factor in ['Notebook', 'Laptop'] else
                   ( 'mounted' if ansible_facts.form_factor == 'Desktop' else 'absent' ) }}"
        boot: "{{ ansible_facts.form_factor == 'Desktop' }}"
      loop:
        - { src: 192.168.0.7:/data, path: /data }
        - { src: 192.168.0.7:/home/christine, path: /home/base/christine }
        - { src: 192.168.0.7:/home/phil, path: /home/base/phil }

    - name: Enable rpmfusion repos
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
        disable_gpg_check: yes
      with_items:
        - "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ansible_facts['distribution_major_version']}}.noarch.rpm"
        - "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ansible_facts['distribution_major_version']}}.noarch.rpm"

    - name: Switch to full ffmpeg from rpmfusion
      ansible.builtin.command:
        cmd: dnf swap ffmpeg-free ffmpeg --allowerasing --assumeyes
      when: "'ffmpeg' not in ansible_facts.packages"

    - name: Upgrade mesa packages before swapping drivers
      ansible.builtin.dnf:
        name: mesa*
        state: latest

    - name: Refresh package facts after mesa upgrade
      ansible.builtin.package_facts:
        manager: auto

    - name: Check GPU type
      ansible.builtin.shell: lshw -class display -json | jq -r '.[].vendor'
      register: gpu_type
      changed_when: false

    - name: Switch to hardware codecs with AMD from rpmfusion
      ansible.builtin.command:
        cmd: "dnf swap {{ item.pkg }}{{ suffix }} {{ item.pkg }}-freeworld{{ suffix }} --assumeyes"
      vars:
        suffix: "{{ '.i686' if item.arch == 'i686' else '' }}"
      loop:
        - { pkg: 'mesa-va-drivers',    arch: 'x86_64' }
        - { pkg: 'mesa-vdpau-drivers', arch: 'x86_64' }
        - { pkg: 'mesa-va-drivers',    arch: 'i686'   }
        - { pkg: 'mesa-vdpau-drivers', arch: 'i686'   }
      loop_control:
        label: "{{ item.pkg }} ({{ item.arch }})"
      when: |
        gpu_type.stdout.startswith('Advanced Micro Devices') and
        item.pkg in ansible_facts.packages and
        ansible_facts.packages[item.pkg] | selectattr('arch', 'equalto', item.arch) | list | length > 0 and (
        (item.pkg + "-freeworld") not in ansible_facts.packages or
        ansible_facts.packages[item.pkg + "-freeworld"] | selectattr('arch', 'equalto', item.arch) | list | length == 0 )

    - name: Switch to hardware codecs with Intel from rpmfusion
      ansible.builtin.dnf:
        name: [ "intel-media-driver", "libva-intel-driver" ]
      when: |
        gpu_type.stdout == 'Intel Corporation'

    - name: Install kmod-v4l2loopback from rpmfusion
      ansible.builtin.dnf:
        name: kmod-v4l2loopback
        state: present

    - name: Install Steam from rpmfusion (only on machines with >=32GB RAM)
      ansible.builtin.dnf:
        name: steam
        state: present
      when: ansible_facts.memtotal_mb >= 32000

    - name: Install v4l2loopback and obs-studio-plugin-x264 from rpmfusion
      ansible.builtin.dnf:
        name: ["v4l2loopback", "obs-studio-plugin-x264"]
        state: present

    - name: Make Linux great again (disable CPU vulnerability mitigations)
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX="(.*)(?<! mitigations=off)"$'
        replace: 'GRUB_CMDLINE_LINUX="\1 mitigations=off"'
      register: mitigations
      when: ansible_facts.form_factor in ['Notebook', 'Laptop', 'Desktop']

    - name: Find swap partition (excluding zram)
      ansible.builtin.shell: |
        set -o pipefail
        devs=$(grep -E -v "zram|Filename" /proc/swaps | cut -f 1 -d " ")
        if [ -n "$devs" ]; then
          lsblk --noheadings -o UUID $devs
        fi
      register: swap_dev_uuid
      changed_when: false

    - name: Find swap LVM LV (if swap is on an LV)
      ansible.builtin.shell: |
        set -o pipefail
        dev=$(grep -E -v "zram|Filename" /proc/swaps | cut -f 1 -d " " | head -n1)
        if [ -n "$dev" ]; then
          lvs --noheadings -o vg_name,lv_name --separator=/ "$dev" 2>/dev/null | tr -d ' ' || true
        fi
      register: swap_lvm_lv
      changed_when: false

    - name: Enable hibernate (suspend to disk)
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX="(?!resume=)(.*)"$'
        replace: 'GRUB_CMDLINE_LINUX="resume=UUID={{ swap_dev_uuid.stdout }} \1"'
      register: enable_hibernate
      when:
        - ansible_facts.form_factor in ['Notebook', 'Laptop', 'Desktop']
        - swap_dev_uuid.stdout | trim != ''

    - name: Activate swap LV from initramfs (required to resume when swap is on LVM)
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX="(?!.*rd\.lvm\.lv={{ swap_lvm_lv.stdout }})(.*)"$'
        replace: 'GRUB_CMDLINE_LINUX="\1 rd.lvm.lv={{ swap_lvm_lv.stdout }}"'
      register: rd_lvm_lv
      when:
        - ansible_facts.form_factor in ['Notebook', 'Laptop', 'Desktop']
        - swap_lvm_lv.stdout | trim != ''

    - name: Enable resume from hibernation
      ansible.builtin.lineinfile:
        path: /etc/dracut.conf.d/resume.conf
        line: add_dracutmodules+=" resume "
        create: yes
      register: dracut_resume
      when: swap_dev_uuid.stdout | trim != ''

    - name: Regenerate initramfs
      ansible.builtin.command:
        cmd: dracut --force
      when: dracut_resume.changed

    - name: Regenerate grub config after touching default/grub
      ansible.builtin.command:
        cmd: grub2-mkconfig -o /etc/grub2.cfg
      when: ansible_facts.form_factor in ['Notebook', 'Laptop', 'Desktop'] and ( mitigations.changed or enable_hibernate.changed or rd_lvm_lv.changed )

    - name: Framework Laptop specifics repo
      community.general.copr:
        name: bsvh/fw-ectool
        state: enabled
      when: "ansible_facts.board_vendor == 'Framework'"

    - name: Framework Laptop firmware tool, and fingerprint reader support
      ansible.builtin.dnf:
        name: ["fw-ectool", "fprintd-pam", "fprintd"]
        update_cache: yes
        state: present
      when: "ansible_facts.board_vendor == 'Framework'"

    - name: Install Wireguard on Laptop
      ansible.builtin.dnf:
        name: wireguard-tools
        update_cache: yes
        state: present
      when: ansible_facts.form_factor in [ 'Notebook', 'Laptop' ]

    # The community.general.nmcli module has no wake_on_lan property, so set it via nmcli directly.
    - name: Get current WoL setting on wired connection
      ansible.builtin.command:
        cmd: nmcli -g 802-3-ethernet.wake-on-lan connection show "Kabelgebundene Verbindung 1"
      register: wol_current
      changed_when: false
      when: ansible_facts.form_factor == 'Desktop'

    - name: Enable WoL on wired connection
      ansible.builtin.command:
        cmd: nmcli connection modify "Kabelgebundene Verbindung 1" 802-3-ethernet.wake-on-lan magic
      register: wol_set
      when:
        - ansible_facts.form_factor == 'Desktop'
        - "'magic' not in (wol_current.stdout | default(''))"

    - name: Reactivate wired connection to apply WoL
      ansible.builtin.command:
        cmd: nmcli connection up "Kabelgebundene Verbindung 1"
      when: wol_set.changed

    - name: Get previous Wireguard config
      ansible.builtin.copy:
        src: "{{ old_root }}/etc/wireguard/"
        dest: /etc/wireguard/
        remote_src: true
      when: old_root is defined and ansible_facts.form_factor in [ 'Notebook', 'Laptop' ]

    - name: Install k3b if a CDROM drive is present
      ansible.builtin.dnf:
        name: k3b
        state: present
      when: ansible_facts.devices.keys() | select('match', '^sr\\d+$') | list | length > 0

    - name: List existing NetworkManager connections
      ansible.builtin.command:
        cmd: nmcli -t -f TYPE,NAME connection show
      become_user: phil
      register: nm_connections_raw
      changed_when: false
      when: ansible_facts.form_factor in [ 'Notebook', 'Laptop' ]

    - name: Filter wireguard connections
      ansible.builtin.set_fact:
        nm_wg_connections: "{{ nm_connections_raw.stdout_lines | default([]) | select('match', '^wireguard:') | map('regex_replace', '^wireguard:', '') | list }}"
      when: ansible_facts.form_factor in [ 'Notebook', 'Laptop' ]

    - name: Stat Wireguard config files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/wireguard/linbit.conf
        - /etc/wireguard/base.conf
      register: wg_config_stats
      when: ansible_facts.form_factor in [ 'Notebook', 'Laptop' ]

    - name: Import Wireguard connection configs
      ansible.builtin.command:
        cmd: "nmcli connection import type wireguard file {{ item.item }}"
      loop: "{{ wg_config_stats.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - ansible_facts.form_factor in [ 'Notebook', 'Laptop' ]
        - item.stat.exists
        - (item.item | basename | splitext | first) not in nm_wg_connections

    - name: Create default storage pool for virsh and libvirt
      ansible.builtin.command:
        cmd: virsh pool-define-as --name default --type dir --target /var/lib/libvirt/images
        creates: /etc/libvirt/storage/default.xml

    - name: Autostart default storage pool for virsh and libvirt
      ansible.builtin.command:
        cmd: virsh pool-autostart default
        creates: /etc/libvirt/storage/autostart/default.xml

    - name: define VMs
      ansible.builtin.command:
        cmd: virsh define {{ item }}
        creates: /etc/libvirt/qemu/{{ item | basename }}
      with_fileglob: "{{ old_root }}/etc/libvirt/qemu/*.xml"
      when: old_root is defined

    - name: Install flatpak
      ansible.builtin.dnf:
        name: flatpak
        state: present

    - name: Enable Flathub remote system-wide
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
        method: system
        state: present

    - name: Install Signal Desktop from Flathub
      community.general.flatpak:
        name: org.signal.Signal
        method: system
        state: present

    - name: Install Java runtime (required by Apache Directory Studio)
      ansible.builtin.dnf:
        name: java-latest-openjdk
        state: present

    - name: Download and extract Apache Directory Studio into /opt
      ansible.builtin.unarchive:
        src: https://dlcdn.apache.org/directory/studio/2.0.0.v20210717-M17/ApacheDirectoryStudio-2.0.0.v20210717-M17-linux.gtk.x86_64.tar.gz
        dest: /opt
        remote_src: true
        creates: /opt/ApacheDirectoryStudio/ApacheDirectoryStudio

    - name: Symlink Apache Directory Studio launcher into PATH
      ansible.builtin.file:
        src: /opt/ApacheDirectoryStudio/ApacheDirectoryStudio
        dest: /usr/local/bin/ApacheDirectoryStudio
        state: link

    # ads-tls.security forces TLSv1.2 (disables TLSv1.3 and weak algorithms); the .ini wires
    # it in via -vmargs. Reason: this ADS build bundles an old Apache MINA (its TLS layer)
    # that predates TLS 1.3. With TLS 1.3 the server sends post-handshake records (chiefly
    # NewSessionTicket) interleaved with the application data; MINA's pre-1.3 SslHandler
    # mishandles the resulting SSLEngine states and never unwraps/dispatches the decrypted
    # BindResponse. The bind succeeds and slapd replies, but the response never reaches ADS,
    # so its queue stays empty and after 30 s you get RESPONSE_QUEUE_EMPTIED / TIMEOUT_OCCURED.
    # Pinning the session to TLS 1.2 avoids the post-handshake path entirely. (Newer ADS
    # releases ship an updated MINA that handles this correctly.)
    - name: Configure Apache Directory Studio TLS security policy
      ansible.builtin.copy:
        dest: /opt/ApacheDirectoryStudio/ads-tls.security
        owner: root
        group: root
        mode: '0644'
        content: |
          jdk.tls.disabledAlgorithms=SSLv3, TLSv1, TLSv1.1, DTLSv1.0, TLSv1.3, RC4, DES, MD5withRSA, DH keySize < 1024, EC keySize < 224, 3DES_EDE_CBC, anon, NULL, ECDH, TLS_RSA_*, rsa_pkcs1_sha1 usage HandshakeSignature, ecdsa_sha1 usage HandshakeSignature, dsa_sha1 usage HandshakeSignature

    # Inject only our two JVM args into the vendor .ini (rather than rewriting the whole
    # file) so a future ADS version bump keeps its own build-specific launcher lines.
    # The block lands right after -vmargs, so both args end up in the JVM args section.
    - name: Point Apache Directory Studio at the TLS 1.2 security policy
      ansible.builtin.blockinfile:
        path: /opt/ApacheDirectoryStudio/ApacheDirectoryStudio.ini
        insertafter: '^-vmargs$'
        marker: "# {mark} ANSIBLE MANAGED (force TLS 1.2)"
        block: |
          -Djdk.tls.client.protocols=TLSv1.2
          -Djava.security.properties=/opt/ApacheDirectoryStudio/ads-tls.security

